<style>

*{box-sizing:border-box}body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#16233f;margin:0}.wrap{max-width:1500px;margin:auto;padding:30px}.header{background:#fff;border-radius:18px;padding:24px;border-top:8px solid var(--red);box-shadow:0 8px 24px rgba(18,60,140,.06)}h1{color:var(--blue);margin:0 0 8px}.sub{margin:0;color:#65718a}.notice{margin-top:12px;padding:10px 12px;border-radius:9px;background:#fff7ed;color:#9a3412;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(18,60,140,.05)}.card h3{margin:0 0 12px}.big{font-size:40px;font-weight:700;color:var(--blue)}.big.str{color:var(--str-text)}.red{color:var(--red)}.meta{color:#6b7280;font-size:13px;margin:8px 0 0}.section{font-size:24px;font-weight:700;margin:30px 0 15px}.regions{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(18,60,140,.05)}.chart-legend{display:flex;justify-content:flex-end;gap:18px;color:#65718a;font-size:13px;margin-bottom:10px}.chart-row{display:grid;grid-template-columns:82px minmax(300px,1fr) 105px;gap:18px;align-items:center;padding:15px 4px;border-top:1px solid #edf1f7}.chart-row:first-of-type{border-top:0}.chart-name{font-size:17px;font-weight:700;color:var(--blue)}.bar-pair{display:grid;gap:8px}.bar-line{display:grid;grid-template-columns:34px 1fr 82px;gap:9px;align-items:center;font-size:12px}.bar-track{height:15px;background:#edf1f7;border-radius:4px;overflow:hidden}.bar-fill{height:100%;min-width:2px;border-radius:4px}.bar-fill.stw{background:#3b82f6}.bar-fill.str{background:#f59e0b}.bar-value{text-align:right;font-weight:700;color:#34415c}.rate-box{text-align:center;padding:9px 6px;background:#fff1f2;border-radius:10px;color:#9f1239}.rate-box span{display:block;font-size:11px}.rate-box strong{font-size:20px}.table-card{padding:0;overflow:hidden}.table-wrap{overflow:auto;max-height:650px}table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;min-width:1180px}th{background:var(--blue);color:#fff;padding:12px 10px;position:sticky;top:0;z-index:2;white-space:nowrap}td{padding:10px;border-bottom:1px solid #e8edf5;text-align:center;white-space:nowrap}td:nth-child(3){text-align:left}.dealer-detail th:nth-child(n+4):nth-child(-n+7){background:var(--stw-head);color:var(--stw-text)}.dealer-detail td:nth-child(n+4):nth-child(-n+7){background:var(--stw-bg);color:var(--stw-text)}.dealer-detail th:nth-child(n+8):nth-child(-n+11){background:var(--str-head);color:var(--str-text)}.dealer-detail td:nth-child(n+8):nth-child(-n+11){background:var(--str-bg);color:var(--str-text)}.dealer-detail th:nth-child(7),.dealer-detail td:nth-child(7),.dealer-detail th:nth-child(11),.dealer-detail td:nth-child(11){font-weight:700}.dealer-detail td:nth-child(12){color:var(--red);font-weight:700}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select{padding:9px 12px;border:1px solid #d7deea;border-radius:9px;background:#fff;color:#16233f}.legend{margin-left:auto;font-size:13px;color:#6b7280}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 5px 0 12px}.dot.stw{background:#3b82f6}.dot.str{background:#f59e0b}@media(max-width:800px){.wrap{padding:16px}.kpis{grid-template-columns:1fr}.legend{margin-left:0}.big{font-size:34px}.chart-row{grid-template-columns:64px minmax(210px,1fr) 86px;gap:8px}.regions{overflow-x:auto}.bar-line{grid-template-columns:30px 1fr 66px}}
.wrap{max-width:1240px;padding:24px}.header,.card,.regions{border:1px solid #e6eaf0;box-shadow:none}.header{border:0;border-radius:0;background:transparent;padding:0;margin-bottom:18px}.header h1{margin:0;font-size:26px;color:#172033}.header .sub{color:#6d7788;margin-top:6px;font-size:14px}.kpis{gap:12px;margin-top:20px}.card{border-radius:16px;padding:22px}.card h3{font-size:13px;font-weight:500;color:#6d7788;margin:0}.big{font-size:42px;font-weight:780;margin:7px 0;color:#172033}.big.str{color:#172033}.hl-note{font-size:13px;color:#6d7788;margin-top:3px}.sku-note{font-size:11px;line-height:1.55;color:#7b8493;margin:7px 0 0}.trend-panel{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:18px;margin-top:14px}.trend-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.trend-title{font-size:17px;font-weight:720}.trend-legend{display:flex;gap:18px;color:#6d7788;font-size:12px}.trend-panel svg{display:block;width:100%;height:auto;min-width:620px}.trend-scroll{overflow-x:auto}.trend-grid{stroke:#e6eaf0;stroke-width:1}.trend-axis{fill:#6d7788;font-size:12px}.trend-bar-stw{fill:#93c5fd}.trend-bar-str{fill:#86efac}.trend-value-stw{fill:#1f5fae;font-size:12px;font-weight:700}.trend-value-str{fill:#27815b;font-size:12px;font-weight:700}.section{font-size:18px;font-weight:720;margin:25px 0 12px}.regions{border-radius:16px;padding:18px}.table-card{border:1px solid #e6eaf0;border-radius:16px}.controls{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:14px 18px;margin-bottom:12px}select{border:1px solid #d1d5db;border-radius:10px;padding:9px 12px;font-size:14px}.dealer-detail th{background:#fff;color:#6d7788;font-weight:600;border-bottom:1px solid #e6eaf0}.dealer-detail th.th-stw{background:#eef5fc;color:#1f5fae;text-align:center}.dealer-detail th.th-str{background:#eef8f3;color:#27815b;text-align:center}.dealer-detail th.th-rate{background:#fff;color:#b63b3b}.dealer-detail td{font-size:13px;border-bottom:1px solid #e6eaf0}.notice{display:none}.bar-fill.stw,.dot.stw{background:#93c5fd}.bar-fill.str,.dot.str{background:#86efac}
.trend-bar-stw{fill:#1f5fae}.trend-bar-str{fill:#27815b}.trend-value-stw{fill:#1f5fae}.trend-value-str{fill:#27815b}.bar-fill.stw,.dot.stw{background:#1f5fae}.bar-fill.str,.dot.str{background:#27815b}.dealer-detail th.th-stw-group{background:#174d8c;color:#fff;text-align:center}.dealer-detail th.th-stw-month{background:#e8f2fb;color:#1f5fae;text-align:center}.dealer-detail th.th-stw-ytd{background:#76a9dc;color:#fff;text-align:center}.dealer-detail th.th-str-group{background:#216b4d;color:#fff;text-align:center}.dealer-detail th.th-str-month{background:#e7f4ed;color:#27815b;text-align:center}.dealer-detail th.th-str-ytd{background:#72b391;color:#fff;text-align:center}.dealer-detail th.th-rate{background:#b63b3b;color:#fff}.dealer-detail td:nth-child(n+4):nth-child(-n+7){background:#eef5fc;color:#1f5fae}.dealer-detail td:nth-child(n+8):nth-child(-n+11){background:#eef8f3;color:#166534}.rate-cell{min-width:90px}.rate-value{display:block;color:#b63b3b;font-weight:700}.rate-track{height:6px;margin-top:5px;background:#f7dede;border-radius:99px;overflow:hidden}.rate-fill{height:100%;background:#b63b3b;border-radius:99px}
.dealer-detail thead tr:first-child th{position:sticky;top:0;z-index:5;height:42px}.dealer-detail thead tr:nth-child(2) th{position:sticky;top:42px;z-index:4;height:42px}.dealer-detail thead .th-stw-group{background:#174d8c!important;color:#fff!important}.dealer-detail thead .th-str-group{background:#216b4d!important;color:#fff!important}.dealer-detail thead .th-rate{background:#b63b3b!important;color:#fff!important}.dealer-detail thead .th-stw-month{background:#e8f2fb!important;color:#1f5fae!important}.dealer-detail thead .th-stw-ytd{background:#cfe3f5!important;color:#174d8c!important}.dealer-detail thead .th-str-month{background:#e7f4ed!important;color:#27815b!important}.dealer-detail thead .th-str-ytd{background:#cfe8dc!important;color:#165a3f!important}
.dealer-detail tbody td:nth-child(7){background:#cfe3f5!important;color:#174d8c!important}.dealer-detail tbody td:nth-child(11){background:#cfe8dc!important;color:#165a3f!important}.dealer-detail thead tr:first-child th:nth-child(1),.dealer-detail tbody td:nth-child(1){position:sticky;left:0;width:90px;min-width:90px;max-width:90px}.dealer-detail thead tr:first-child th:nth-child(2),.dealer-detail tbody td:nth-child(2){position:sticky;left:90px;width:140px;min-width:140px;max-width:140px}.dealer-detail thead tr:first-child th:nth-child(3),.dealer-detail tbody td:nth-child(3){position:sticky;left:230px;width:250px;min-width:250px;max-width:250px;box-shadow:4px 0 6px rgba(23,32,51,.06)}.dealer-detail tbody td:nth-child(-n+3){background:#fff;z-index:2}.dealer-detail thead tr:first-child th:nth-child(-n+3){z-index:8;background:#fff;color:#6d7788}
.dealer-detail thead .th-rate{background:#f6dada!important;color:#9f2f2f!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="wrap">
<div class="header"><h1>雪白听销量追踪</h1><p class="sub">数据更新至 2026/8/15 · STW/STR周期：6/29–8/15</p></div>
<div class="kpis"><div class="card"><h3>累计 STW</h3><div class="big" id="kpiStw">--</div><div class="hl-note" id="kpiStwHl"></div></div><div class="card"><h3>累计 STR</h3><div class="big str" id="kpiStr">--</div><div class="hl-note" id="kpiStrHl"></div></div><div class="card"><h3>雪白听渗透率</h3><div class="big red" id="kpiRate">--</div><p class="meta">雪白听同期 STR(HL) / 大富豪IH主要SKU同期 STR(HL)</p><p class="meta" id="kpiHl"></p><p class="sku-note">主要SKU包括：超爽瓶/听、金麦芽听、金飘铃瓶、通州瓶、雪白瓶/听</p></div></div>
<div class="trend-panel"><div class="trend-head"><div class="trend-title">STW / STR 分月趋势</div><div class="trend-legend"><span><i class="dot stw"></i>STW</span><span><i class="dot str"></i>STR</span></div></div><div class="trend-scroll"><svg id="monthlyTrend" viewBox="0 0 1000 280" role="img" aria-label="6月至8月STW和STR趋势图"></svg></div></div>
<div class="section">M3区域表现</div><div class="regions" id="regions"></div>
<div class="section">经销商明细</div><div class="controls"><label>M3：<select id="m3Filter"><option value="">全部</option></select></label><label>排序标准：<select id="sortBy"><option value="m3">按M3默认顺序</option><option value="stwYtd">YTD STW</option><option value="strYtd">YTD STR</option><option value="stwAug">8月MTD STW</option><option value="strAug">8月MTD STR</option><option value="rate">雪白听渗透率</option></select></label><label>顺序标准：<select id="sortDir"><option value="desc">高 → 低</option><option value="asc">低 → 高</option></select></label><span id="rowCount"></span><span class="legend"><i class="dot stw"></i>STW<i class="dot str"></i>STR<span style="margin-left:12px">单位：箱</span></span></div>
<div class="card table-card"><div class="table-wrap"><table class="dealer-detail"><thead><tr><th rowspan="2">M3</th><th rowspan="2">M2</th><th rowspan="2">经销商</th><th colspan="4" class="th-stw-group">STW</th><th colspan="4" class="th-str-group">STR</th><th rowspan="2" class="th-rate">雪白听渗透率</th></tr><tr><th class="th-stw-month">6月</th><th class="th-stw-month">7月</th><th class="th-stw-month">8月MTD</th><th class="th-stw-ytd">YTD</th><th class="th-str-month">6月</th><th class="th-str-month">7月</th><th class="th-str-month">8月MTD</th><th class="th-str-ytd">YTD</th></tr></thead><tbody id="dealerBody"></tbody></table></div></div>
</div><script>
let DATA=null;
const fmt=n=>Math.round(n||0).toLocaleString('zh-CN');
const fmtHl=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=n=>n==null?'--':(n*100).toFixed(1)+'%';
const M3_ORDER=['丁点','杨晓超','孟祥杰','肖锡龙','杨军'];
const M2_ORDER=['黄新军&许艳','谢国峰','蔡芳','季红州','梅宇飞','高凌峰','陈永华','杭佳琪','茅东标','王震-泰州','王震-泰兴','是焱彬-靖江','是焱彬-姜堰','张雷','刘洲&李海伟'];
const displayM2=m2=>String(m2).replace('邵毅/李海伟','刘洲&李海伟');
const m2Rank=m2=>{const i=M2_ORDER.indexOf(displayM2(m2));return i<0?999:i};
function renderDashboard(DATA){
const viewDealers=DATA.dealers.filter(d=>M3_ORDER.includes(d.m3)&&(d.stw_ytd!==0||d.str_ytd!==0));
const viewRegions=M3_ORDER.map(name=>DATA.regions.find(r=>r.m3===name)).filter(Boolean);
const viewTotals=viewDealers.reduce((a,d)=>({stw:a.stw+d.stw_ytd,str:a.str+d.str_ytd,snow_hl:a.snow_hl+d.snow_hl,ih_hl:a.ih_hl+d.ih_hl}),{stw:0,str:0,snow_hl:0,ih_hl:0});
viewTotals.penetration=viewTotals.ih_hl?viewTotals.snow_hl/viewTotals.ih_hl:null;
document.getElementById('kpiStw').textContent=fmt(viewTotals.stw)+' 箱';
document.getElementById('kpiStr').textContent=fmt(viewTotals.str)+' 箱';
document.getElementById('kpiStwHl').textContent=`折合 ${fmtHl(viewTotals.stw*0.06)} HL`;
document.getElementById('kpiStrHl').textContent=`折合 ${fmtHl(viewTotals.str*0.06)} HL`;
document.getElementById('kpiRate').textContent=pct(viewTotals.penetration);
document.getElementById('kpiHl').textContent=`${fmt(viewTotals.snow_hl)} HL / ${fmt(viewTotals.ih_hl)} HL`;
const monthNames=['6月','7月','8月 MTD'];
const monthlyStw=[0,1,2].map(i=>viewDealers.reduce((a,d)=>a+d.stw[i],0));
const monthlyStr=[0,1,2].map(i=>viewDealers.reduce((a,d)=>a+d.str[i],0));
const trendMax=Math.max(...monthlyStw,...monthlyStr)*1.12;
const tx=[220,500,780],ty=v=>220-(v/trendMax)*165,barW=72;
document.getElementById('monthlyTrend').innerHTML=[0,.25,.5,.75,1].map(p=>`<line class="trend-grid" x1="90" y1="${220-p*165}" x2="920" y2="${220-p*165}"/><text class="trend-axis" x="78" y="${224-p*165}" text-anchor="end">${fmt(trendMax*p)}</text>`).join('')+`<text class="trend-axis" x="20" y="22">单位：箱</text>`+monthNames.map((m,i)=>`<rect class="trend-bar-stw" x="${tx[i]-barW-6}" y="${ty(monthlyStw[i])}" width="${barW}" height="${220-ty(monthlyStw[i])}" rx="5"/><text class="trend-value-stw" x="${tx[i]-barW/2-6}" y="${ty(monthlyStw[i])-8}" text-anchor="middle">${fmt(monthlyStw[i])}</text><rect class="trend-bar-str" x="${tx[i]+6}" y="${ty(monthlyStr[i])}" width="${barW}" height="${220-ty(monthlyStr[i])}" rx="5"/><text class="trend-value-str" x="${tx[i]+barW/2+6}" y="${ty(monthlyStr[i])-8}" text-anchor="middle">${fmt(monthlyStr[i])}</text><text class="trend-axis" x="${tx[i]}" y="255" text-anchor="middle">${m}</text>`).join('');
const regionMax=Math.max(...viewRegions.flatMap(r=>[r.stw_ytd,r.str_ytd]));
document.getElementById('regions').innerHTML=`<div class="chart-legend"><span><i class="dot stw"></i>YTD STW</span><span><i class="dot str"></i>YTD STR</span><span>单位：箱</span></div>`+viewRegions.map(r=>`<div class="chart-row"><div class="chart-name">${r.m3}</div><div class="bar-pair"><div class="bar-line"><span>STW</span><div class="bar-track"><div class="bar-fill stw" style="width:${r.stw_ytd/regionMax*100}%"></div></div><span class="bar-value">${fmt(r.stw_ytd)}</span></div><div class="bar-line"><span>STR</span><div class="bar-track"><div class="bar-fill str" style="width:${r.str_ytd/regionMax*100}%"></div></div><span class="bar-value">${fmt(r.str_ytd)}</span></div></div><div class="rate-box"><span>渗透率</span><strong>${pct(r.penetration)}</strong></div></div>`).join('');
const filter=document.getElementById('m3Filter');
const sortBy=document.getElementById('sortBy');
const sortDir=document.getElementById('sortDir');
M3_ORDER.forEach(v=>filter.add(new Option(v,v)));
function render(){
  const rows=viewDealers.filter(d=>!filter.value||d.m3===filter.value).slice();
  const m3Sort=(a,b)=>M3_ORDER.indexOf(a.m3)-M3_ORDER.indexOf(b.m3)||m2Rank(a.m2)-m2Rank(b.m2)||displayM2(a.m2).localeCompare(displayM2(b.m2),'zh-CN')||a.dealer.localeCompare(b.dealer,'zh-CN');
  const sortValue=(d,key)=>key==='stwYtd'?d.stw_ytd:key==='strYtd'?d.str_ytd:key==='stwAug'?d.stw[2]:key==='strAug'?d.str[2]:key==='rate'?(d.penetration??-1):0;
  if(sortBy.value==='m3') rows.sort(m3Sort);
  else{const direction=sortDir.value==='asc'?1:-1;rows.sort((a,b)=>direction*(sortValue(a,sortBy.value)-sortValue(b,sortBy.value))||m3Sort(a,b))}
  document.getElementById('rowCount').textContent=`共 ${rows.length} 家经销商`;
  document.getElementById('dealerBody').innerHTML=rows.map(d=>`<tr><td>${d.m3}</td><td>${displayM2(d.m2)}</td><td>${d.dealer}</td>${d.stw.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${fmt(d.stw_ytd)}</td>${d.str.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${fmt(d.str_ytd)}</td><td class="rate-cell"><span class="rate-value">${pct(d.penetration)}</span><div class="rate-track"><div class="rate-fill" style="width:${d.penetration?Math.min(d.penetration*100,100):0}%"></div></div></td></tr>`).join('')||'<tr><td colspan="12">暂无数据</td></tr>';
}
filter.addEventListener('change',render);sortBy.addEventListener('change',render);sortDir.addEventListener('change',render);render();
}
const secureClient=supabase.createClient('https://hjuemoaxwotvgvppuits.supabase.co','sb_publishable_kLCQcltuyPsjoM5udpUu4A_8iw1R-oD');
async function bootstrapSales(){
  const {data:{session}}=await secureClient.auth.getSession();
  if(!session){document.body.innerHTML='<div style="max-width:520px;margin:12vh auto;padding:28px;font-family:sans-serif"><h2>请先登录</h2><p>请从雪白看板首页登录后查看销量数据。</p></div>';return}
  const {data,error}=await secureClient.from('sales_dashboard_data').select('payload').eq('id','current').single();
  if(error||!data){document.body.innerHTML='<div style="max-width:620px;margin:12vh auto;padding:28px;font-family:sans-serif"><h2>销量数据读取失败</h2><p>'+((error&&error.message)||'暂无数据')+'</p></div>';return}
  DATA=data.payload;renderDashboard(DATA);
}
bootstrapSales();
</script></body></html>
