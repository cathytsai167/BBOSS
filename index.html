<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大富豪雪白新品 Tracking Dashboard</title>
<style>
:root{--blue:#123c8c;--red:#c40000;--bg:#eef2f7;--line:#dce3ee}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#172033;font-size:16px}body.is-locked>.shell,body.is-locked>.viewport{display:none}.auth-gate{width:min(420px,calc(100% - 32px));margin:12vh auto;padding:24px;border-radius:16px;background:#fff;box-shadow:0 12px 36px rgba(25,40,70,.12)}.auth-gate h1{margin:0 0 8px;font-size:26px}.auth-gate p{margin:0 0 18px;color:#6d7788}.auth-gate label{display:block;margin:12px 0 6px;font-weight:700}.auth-gate input{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:10px;font-size:17px}.auth-gate button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#194f90;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.auth-gate button:disabled{opacity:.6}.auth-msg{min-height:22px;margin-top:10px;color:#c0392b;font-size:14px}.shell{background:#fff;border-top:6px solid var(--red);box-shadow:0 3px 14px rgba(18,60,140,.1);z-index:2}.shell-inner{max-width:1600px;margin:auto;padding:14px 22px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand h1{font-size:25px;color:var(--blue);margin:0}.brand p{font-size:14px;color:#6d7788;margin:4px 0 0}.tabs{display:flex;gap:4px;margin-top:13px}.tab{border:0;background:transparent;color:#65718a;font-size:17px;font-weight:700;padding:11px 20px;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.logout{border:1px solid #d9dee8;border-radius:9px;background:#fff;padding:8px 12px;color:#344054;cursor:pointer;font-size:15px}.viewport{flex:1;min-height:0;position:relative}.page{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f7fb;display:none}.page.active{display:block}@media(max-width:650px){.shell-inner{padding:12px 12px 0}.topline{align-items:flex-start}.brand h1{font-size:20px}.tab{padding:10px 14px;font-size:15px}}
</style>
</head>
<body class="is-locked">
<div id="authGate" class="auth-gate"><h1>Dashboard 登录</h1><p>仅限管理员查看完整数据</p><label for="loginEmail">邮箱</label><input id="loginEmail" type="email" autocomplete="username" placeholder="请输入管理员邮箱"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码"><button id="loginBtn" type="button">登录查看</button><div id="loginMsg" class="auth-msg" aria-live="polite"></div></div>
<header class="shell"><div class="shell-inner"><div class="topline"><div class="brand"><h1>大富豪雪白新品 Tracking Dashboard</h1><p>铺货执行与销量表现统一追踪</p></div><button id="logoutBtn" class="logout" type="button">退出登录</button></div><nav class="tabs" aria-label="Dashboard模块"><button class="tab active" data-page="sales">销量表现</button><button class="tab" data-page="distribution">铺货进度</button><button class="tab" data-page="analysis">综合分析</button></nav></div></header>
<main class="viewport"><iframe class="page active" id="sales" src="sales.html" title="销量表现"></iframe><iframe class="page" id="distribution" src="distribution.html" title="铺货进度"></iframe><iframe class="page" id="analysis" src="analysis.html" title="综合分析"></iframe></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=supabase.createClient('https://hjuemoaxwotvgvppuits.supabase.co','sb_publishable_kLCQcltuyPsjoM5udpUu4A_8iw1R-oD');
const tabs=[...document.querySelectorAll('.tab')],pages=[...document.querySelectorAll('.page')];
tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(x=>x.classList.toggle('active',x===tab));pages.forEach(x=>x.classList.toggle('active',x.id===tab.dataset.page));history.replaceState(null,'','#'+tab.dataset.page)}));
const initial=location.hash.slice(1);if(initial&&document.getElementById(initial))document.querySelector(`[data-page="${initial}"]`).click();
async function unlock(){document.body.classList.remove('is-locked');document.getElementById('authGate').hidden=true;document.getElementById('sales').contentWindow.location.reload();document.getElementById('distribution').contentWindow.location.reload();document.getElementById('analysis').contentWindow.location.reload()}
async function startAuth(){const {data}=await client.auth.getSession();if(data.session){await unlock();return}const btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');const signIn=async()=>{const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){msg.textContent='请输入邮箱和密码。';return}btn.disabled=true;btn.textContent='登录中…';msg.textContent='';const {error}=await client.auth.signInWithPassword({email,password});btn.disabled=false;btn.textContent='登录查看';if(error){msg.textContent='登录失败，请检查邮箱或密码。';return}await unlock()};btn.addEventListener('click',signIn);document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()})}
document.getElementById('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});startAuth();
</script>
</body>
</html>
