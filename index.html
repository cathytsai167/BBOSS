<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大富豪新品追踪</title><style>
:root{--accent:#a83f47;--accent-soft:#faecee;--paper:#f8f3f4;--ink:#282b36;--line:#eadde0}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--paper);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}body[data-product="classic"]{--accent:#2863a5;--accent-soft:#eaf1fa;--paper:#f2f6fb;--line:#dbe5f0}.shell{background:#fff;border-top:5px solid var(--accent);box-shadow:0 3px 16px #20273808;z-index:2}.shell-inner{max-width:1600px;margin:auto;padding:16px 26px 0}.topline{display:flex;gap:20px;justify-content:space-between;align-items:center}.brand h1{font-size:24px;color:var(--accent);margin:0;letter-spacing:1px}.brand p{color:#7b7d88;font-size:13px;margin:3px 0}.global-filters{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}.filter-label{font-size:13px;font-weight:650;color:#727582}.filter-buttons{display:flex;flex-wrap:wrap;gap:7px}.product-choice,.region-choice{border:1px solid var(--line);border-radius:9px;padding:7px 15px;background:#fff;color:#666b78;cursor:pointer;font:inherit;font-size:14px}.product-choice[aria-pressed="true"],.region-choice[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:650}.product-choice{font-size:16px;padding:8px 25px}.tabs{display:flex;gap:12px;margin-top:15px}.tab{border:0;background:transparent;color:#787c88;font:inherit;font-weight:650;padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.logout,.onepager{border:1px solid var(--line);background:white;color:var(--accent);border-radius:9px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}.onepager{background:var(--accent-soft)}.actions{display:flex;gap:8px}.viewport{flex:1;min-height:0;position:relative}.page{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);display:none}.page.active{display:block}body.is-locked>.shell,body.is-locked>.viewport{display:none}.auth-gate{width:min(420px,calc(100% - 32px));margin:12vh auto;padding:28px;border-radius:18px;background:white;box-shadow:0 12px 36px #19284618}.auth-gate h1{margin:0 0 8px;font-size:25px}.auth-gate p{margin:0 0 18px;color:#6d7788}.auth-gate label{display:block;margin:12px 0 6px}.auth-gate input{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:10px;font:inherit}.auth-gate button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}.auth-gate button:disabled{opacity:.6}.auth-msg{min-height:22px;margin-top:10px;color:#a83f47;font-size:14px}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:800px){.topline{flex-wrap:wrap}.shell-inner{padding:12px 16px 0}.brand h1{font-size:21px}.global-filters{gap:8px}.region-choice{padding:7px 10px}.actions{margin-left:auto}}@media(max-width:500px){.filter-label{width:100%}.actions{margin-left:0}.brand p{display:none}}
</style></head><body class="is-locked" data-product="snow">
<div id="authGate" class="auth-gate"><h1>大富豪新品追踪</h1><p>登录后查看销量与铺货数据</p><label for="loginEmail">邮箱</label><input id="loginEmail" type="email" autocomplete="username"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn" type="button">登录查看</button><div id="loginMsg" class="auth-msg" aria-live="polite"></div></div>
<header class="shell"><div class="shell-inner"><div class="topline"><div class="brand"><h1>大富豪新品追踪</h1><p id="selectionCaption">雪白听 · 苏东 TTL</p></div><div class="actions"><button id="onepager" class="onepager" type="button">导出区域一页纸</button><button id="logoutBtn" class="logout" type="button">退出登录</button></div></div>
<div class="global-filters"><span class="filter-label">追踪产品</span><div class="filter-buttons" role="group" aria-label="追踪产品"><button class="product-choice" data-product="snow" aria-pressed="true" type="button">雪白听</button><button class="product-choice" data-product="classic" aria-pressed="false" type="button">经典听</button></div></div>
<div class="global-filters"><span class="filter-label">查看区域</span><div class="filter-buttons" role="group" aria-label="查看区域"><button class="region-choice" data-region="" aria-pressed="true" type="button">苏东 TTL</button><button class="region-choice" data-region="丁点" aria-pressed="false" type="button">丁点</button><button class="region-choice" data-region="孟祥杰" aria-pressed="false" type="button">孟祥杰</button><button class="region-choice" data-region="肖锡龙" aria-pressed="false" type="button">肖锡龙</button><button class="region-choice" data-region="杨军" aria-pressed="false" type="button">杨军</button><button class="region-choice" data-region="李小东" aria-pressed="false" type="button">李小东</button></div></div>
<nav class="tabs" aria-label="Dashboard模块"><button class="tab active" data-page="sales" type="button">销量表现</button><button class="tab" data-page="distribution" type="button">铺货进度</button></nav></div></header>
<main class="viewport"><iframe class="page active" id="sales" src="sales.html?v=20261018-regional-monthly" title="销量表现"></iframe><iframe class="page" id="distribution" src="distribution.html?v=20261018-regional-monthly" title="铺货进度"></iframe></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient('https://hjuemoaxwotvgvppuits.supabase.co','sb_publishable_kLCQcltuyPsjoM5udpUu4A_8iw1R-oD');
const tabs=[...document.querySelectorAll('.tab')],pages=[...document.querySelectorAll('.page')];
let selection={product:'snow',region:''};
const targetOrigin=location.origin==='null'?'*':location.origin;
function sendSelection(frame){frame.contentWindow.postMessage({type:'np-selection',selection},targetOrigin)}
function sync(){document.body.dataset.product=selection.product;document.getElementById('selectionCaption').textContent=(selection.product==='snow'?'雪白听':'经典听')+' · '+(selection.region||'苏东 TTL');document.querySelectorAll('.product-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.product===selection.product)));document.querySelectorAll('.region-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.region===selection.region)));pages.forEach(sendSelection)}
document.querySelectorAll('.product-choice').forEach(b=>b.addEventListener('click',()=>{selection.product=b.dataset.product;sync()}));document.querySelectorAll('.region-choice').forEach(b=>b.addEventListener('click',()=>{selection.region=b.dataset.region;sync()}));
window.addEventListener('message',e=>{const frame=pages.find(f=>f.contentWindow===e.source);if(!frame||!(e.origin===location.origin||e.origin==='null'))return;if(e.data?.type==='np-ready')sendSelection(frame);if(e.data?.type==='np-export-done'){const b=document.getElementById('onepager');b.disabled=false;b.textContent='导出区域一页纸'}});pages.forEach(f=>f.addEventListener('load',()=>sendSelection(f)));
tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(x=>x.classList.toggle('active',x===tab));pages.forEach(x=>x.classList.toggle('active',x.id===tab.dataset.page));history.replaceState(null,'','#'+tab.dataset.page);sync()}));
const initial=location.hash.slice(1);if(['sales','distribution'].includes(initial))document.querySelector(`.tab[data-page="${initial}"]`).click();
async function unlock(){document.body.classList.remove('is-locked');document.getElementById('authGate').hidden=true;pages.forEach(f=>f.contentWindow.location.reload());sync()}
async function startAuth(){const {data}=await client.auth.getSession();if(data.session){await unlock();return}const btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');const signIn=async()=>{const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password){msg.textContent='请输入邮箱和密码。';return}btn.disabled=true;btn.textContent='登录中…';msg.textContent='';const {error}=await client.auth.signInWithPassword({email,password});btn.disabled=false;btn.textContent='登录查看';if(error){msg.textContent='登录失败，请检查邮箱或密码。';return}await unlock()};btn.addEventListener('click',signIn);document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()})}
document.getElementById('onepager').addEventListener('click',()=>{const b=document.getElementById('onepager');b.disabled=true;b.textContent='正在生成…';const frame=document.querySelector('.page.active');frame.contentWindow.postMessage({type:'np-export-summary',selection},targetOrigin)});
document.getElementById('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});startAuth();
</script><script src="sales-admin-entry.js?v=20261018-regional-monthly"></script></body></html>
