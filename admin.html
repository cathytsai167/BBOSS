<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员销量更新</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3f4;color:#282b36;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:30px 24px}h1{font-size:25px;color:#a83f47;margin:0}h2{font-size:18px}p{color:#687384}.card{background:#fff;padding:22px;border:1px solid #eadde0;border-radius:14px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;margin:12px 0 5px}input{font:inherit;max-width:100%;padding:8px;border:1px solid #d8dce4;border-radius:7px}button,a.back{font:inherit;border-radius:8px;padding:9px 18px;border:1px solid #eadde0;background:#fff;color:#a83f47;cursor:pointer;text-decoration:none}button.primary{background:#a83f47;color:#fff}button:disabled{opacity:.5;cursor:default}.confirm{display:flex;gap:9px;align-items:flex-start}.confirm input{margin-top:5px}#message{white-space:pre-wrap;color:#a83f47}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:11px;border-bottom:1px solid #e5e8ed;text-align:center}th{background:#faecee}.warn{color:#916b1e;background:#fff8e5;padding:12px;border-radius:8px}.table{overflow:auto}.actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}[hidden]{display:none!important}#locked{padding:25px}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:18px 12px}}
</style></head><body><main><a class="back" href="index.html">返回看板</a><h1 style="margin-top:18px">管理员销量更新</h1><div id="locked">正在核验管理员权限…</div><section id="app" hidden><p>两份底表一起核对，确认后更新雪白听与经典听。原始Excel仅在浏览器本地解析，不上传到公开仓库。</p><div class="card grid"><section><h2>STW底表</h2><input id="stwFiles" type="file" accept=".xlsx" multiple aria-label="STW底表"><label for="stwFrom">从哪个月初完整覆盖</label><input id="stwFrom" type="date" min="2026-08-01" max="2026-12-01"><label for="stwTo">底表截止日期</label><input id="stwTo" type="date" min="2026-08-01" max="2026-12-31"></section><section><h2>STR底表</h2><input id="strFiles" type="file" accept=".xlsx" multiple aria-label="STR底表"><label for="strFrom">从哪个月初完整覆盖</label><input id="strFrom" type="date" min="2026-08-01" max="2026-12-01"><label for="strTo">底表截止日期</label><input id="strTo" type="date" min="2026-08-01" max="2026-12-31"></section></div><div class="card"><label class="confirm"><input id="coverage" type="checkbox"><span>我确认底表包含所选月初到截止日的全部记录，不是仅本周新增量。覆盖期间采用替换，不累加；其他月份保留。6–7月核定数字不覆盖。</span></label><div class="actions"><button id="preview" class="primary">解析并预览</button></div><div id="message" role="status" aria-live="polite"></div></div><section id="review" class="card" hidden><h2>更新预览</h2><p id="dates"></p><div class="table"><table><thead><tr><th>产品</th><th>累计STW（箱）</th><th>累计STR（箱）</th><th>末月STW（箱）</th><th>末月STR（箱）</th><th>累计负STR（箱）</th></tr></thead><tbody id="totals"></tbody></table></div><div id="warnings" class="warn"></div><details><summary>本次处理记录</summary><pre id="sourceDetails" style="white-space:pre-wrap"></pre></details><label class="confirm"><input id="approve" type="checkbox"><span>截止日期、总量和异常已核对，确认更新线上销量。</span></label><div class="actions"><button id="commit" class="primary" disabled>确认更新线上销量</button></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="sales-admin.js?v=20261014-admin-upload"></script></body></html>
