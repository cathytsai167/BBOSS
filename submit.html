<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大富豪新品铺货提报</title><style>:root{--blue:#174d8c;--green:#216b4d;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#21314a;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}main{max-width:1580px;margin:0 auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;background:white;border-top:6px solid #bd4242;border-radius:16px;padding:24px;margin-bottom:18px}h1{font-size:30px;color:var(--blue);margin:0}h2{font-size:21px;margin:0 0 16px}header p{margin:6px 0 0;color:var(--muted)}a{color:var(--blue);text-decoration:none;font-weight:650}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px #233c6810}.preview{padding:12px 16px;background:#fff5df;border:1px solid #eed7a6;border-radius:10px;margin-bottom:20px;color:#89601c;font-size:14px}.toolbar,.sort,.section-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.toolbar span{margin-left:auto;color:var(--muted)}input,select{font:inherit;padding:10px 12px;border:1px solid #d9e2ec;border-radius:9px;background:white;color:#21314a}label{font-weight:600}button{background:var(--blue);color:white;border:0;border-radius:9px;padding:12px 20px;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#edf3fa;color:var(--blue)}button:disabled{opacity:.5;cursor:wait}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.metrics p{margin:0;color:var(--muted)}.metrics strong{display:block;font-size:40px;color:var(--blue);margin:6px 0}.metrics article:nth-child(2) strong{color:var(--green)}small{display:block;color:var(--muted);font-size:13px}.hint{color:var(--muted);font-size:14px;margin:8px 0 14px}.form{max-width:780px;margin:0 auto 20px}.field{margin-bottom:22px}.field label{display:block;margin-bottom:7px}.field input,.field select{width:100%}[hidden]{display:none!important}.guide{max-width:780px;margin:0 auto}.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.region strong{color:var(--blue);font-size:24px}.region p{display:flex;justify-content:space-between;margin:8px 0}.section-head{justify-content:space-between}.table-scroll{overflow:auto;max-height:640px}table{width:100%;min-width:1120px;border-spacing:0}th,td{padding:14px 12px;text-align:right;border-bottom:1px solid #e7edf5;white-space:nowrap}th{position:sticky;top:0;background:#e9f0f8;color:var(--blue);z-index:2}th:first-child,td:first-child{text-align:left}td:nth-child(4){background:#f0f5fc;font-weight:650;color:var(--blue)}td:nth-child(5){color:var(--green)}.tag{padding:4px 8px;border-radius:6px;font-size:13px;background:#fff2d7;color:#916620}.tag.ok{background:#e7f4ed;color:var(--green)}.trend-row{display:grid;grid-template-columns:120px 1fr 180px;align-items:center;gap:18px;margin:16px 0}.track{height:20px;background:#edf2f8;border-radius:5px;overflow:hidden}.fill{height:100%;background:#3479b9;border-radius:5px}.rate-track{height:5px;background:#e8f0ed;margin-top:5px}.rate-fill{height:100%;background:#42966e}.error{color:#b63b3b}.success{color:var(--green)}@media(max-width:1000px){.metrics,.regions{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:14px}header{display:block}header a{display:block;margin-top:15px}.metrics,.regions{grid-template-columns:1fr}.trend-row{grid-template-columns:75px 1fr 105px;gap:10px}.metrics strong{font-size:34px}.toolbar span{margin-left:0}}
.product-block{border-top:1px solid #d9e2ec;padding-top:22px;margin-top:22px}.product-block h2{color:#174d8c}.product-block.classic h2{color:#805c1b}</style></head><body>
<main><header><div><h1>大富豪新品铺货提报</h1><p>更新本月累计新增铺货与目前累计复购。</p></div></header>
<div class="preview">请核对带出的上次数字后提交。</div>
<section class="form card">
<div class="field"><label for="m2">M2</label><select id="m2"><option value="">请选择M2</option><option value="黄新军&许艳">黄新军&许艳</option><option value="谢国峰">谢国峰</option><option value="蔡芳">蔡芳</option><option value="季红州">季红州</option><option value="梅宇飞">梅宇飞</option><option value="高凌峰">高凌峰</option><option value="陈永华">陈永华</option><option value="杭佳琪">杭佳琪</option><option value="茅东标">茅东标</option><option value="是焱彬-姜堰">是焱彬-姜堰</option><option value="是焱彬-靖江">是焱彬-靖江</option><option value="王震-泰兴">王震-泰兴</option><option value="王震-泰州">王震-泰州</option><option value="张雷">张雷</option><option value="费燕锋">费燕锋</option><option value="顾彬">顾彬</option><option value="李海伟">李海伟</option><option value="刘洲">刘洲</option><option value="唐启军">唐启军</option><option value="张旭东">张旭东</option></select></div>
<input id="month" type="hidden"><input id="asOf" type="hidden">
<div class="product-block"><h2>雪白听</h2>


<div class="field"><label for="dist" data-month-label="新增铺货售点数">10月累计新增铺货售点数</label><input id="dist" type="number" min="0" step="1" inputmode="numeric" required></div>
<div class="field"><label for="rep">目前累计已复购售点数</label><input id="rep" type="number" min="0" step="1" inputmode="numeric" required><p class="hint">包含6月起所有已铺货售点，不仅是本月新增售点。</p></div></div>
<div class="product-block classic"><h2>经典听</h2><p id="classicScope" class="hint"></p><p id="classicPrefillNote" class="hint"></p>

<div class="field"><label for="classicNew" data-month-label="新增铺货售点数">10月累计新增铺货售点数</label><input id="classicNew" type="number" min="0" step="1" inputmode="numeric" required></div>
<div class="field"><label for="classicRep">目前累计已复购售点数</label><input id="classicRep" type="number" min="0" step="1" inputmode="numeric" required><p class="hint">包含9月起所有已铺货售点，不仅是本月新增售点。</p></div></div>
<p class="hint">单位：家。同一产品同一售点只计一次。本月新增填累计数，实际为0请填0。</p><div id="last" class="hint"></div>
<button id="refreshLatest" type="button" class="secondary">重新读取最新数字</button> <button disabled id="submit" type="button">一次保存两个新品</button><p id="msg" role="status"></p></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{
  const el=id=>document.getElementById(id),ids=['dist','rep','classicNew','classicRep'];
  const client=supabase.createClient('https://hjuemoaxwotvgvppuits.supabase.co','sb_publishable_kLCQcltuyPsjoM5udpUu4A_8iw1R-oD',{
    auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
  });
  let context=null,busy=false,sequence=0;
  function status(message,error=false){el('msg').textContent=message;el('msg').className=error?'error':'success'}
  function fill(data){
    context=data;el('m2').value=data.m2;el('month').value=data.month;el('asOf').value=data.as_of;
    ids.forEach(id=>el(id).value=data.values[id]??'');
    document.querySelectorAll('[data-month-label]').forEach(l=>l.textContent=Number(data.month.slice(5))+'月累计'+l.dataset.monthLabel);
    el('classicScope').textContent='按当前所选区域分别提报。';
    el('classicPrefillNote').textContent='已带出上次记录；实际为0请填0。';
    el('last').textContent='已带出当前月份上次记录；实际为0请填0。';
    document.querySelector('.preview').textContent='选择M2后核对历史数字，一次提交两个新品。';el('submit').disabled=false;
  }
  async function load(){
    const request=++sequence,m2=el('m2').value;
    context=null;el('submit').disabled=true;
    ids.forEach(id=>el(id).value='');
    ['classicScope','classicPrefillNote','last'].forEach(id=>el(id).textContent='');
    if(!m2){status('请选择M2，自动带出历史数字。');return}
    status('正在读取历史数字…');
    try{
      const result=await client.rpc('xuebai_public_prefill',{p_m2:m2});
      if(request!==sequence||m2!==el('m2').value)return;
      if(result.error)throw result.error;
      if(!result.data||result.data.m2!==m2)throw new Error('返回的M2不一致，请重新读取。');
      fill(result.data);status('历史数字已带出，请核对后提交。');
    }catch(e){if(request===sequence)status('读取失败：'+e.message,true)}
  }
  el('m2').addEventListener('change',()=>{if(!busy)load()});
  el('refreshLatest').addEventListener('click',async()=>{
    if(busy)return;
    if(context&&!window.confirm('重新读取将替换尚未提交的数字，继续？'))return;
    busy=true;try{await load()}catch(e){status('读取失败，请稍后重试。',true)}finally{busy=false}
  });
  el('submit').addEventListener('click',async()=>{
    if(busy||!context||context.m2!==el('m2').value)return;
    if(ids.some(id=>el(id).value===''))return status('请填写全部4项数字，实际为0请填0。',true);
    const values=Object.fromEntries(ids.map(id=>[id,Number(el(id).value)]));
    if(Object.values(values).some(n=>!Number.isSafeInteger(n)||n<0||n>2147483647))return status('请填写有效的非负整数。',true);
    busy=true;el('submit').disabled=true;el('m2').disabled=true;
    try{
      const args={p_m2:context.m2,p_values:values,p_expected_version:context.version,p_allow_decrease:false};
      let result=await client.rpc('xuebai_public_submit',args);
      if(result.error?.message.includes('DECREASE_CONFIRM_REQUIRED')){
        if(!window.confirm('部分数字低于之前记录，确认以本次数值更新？'))return;
        result=await client.rpc('xuebai_public_submit',{...args,p_allow_decrease:true});
      }
      if(result.error)throw result.error;
      fill(result.data);status('提交成功，两个新品数据均已保存。');
    }catch(e){status('提交失败：'+e.message,true)}finally{busy=false;el('m2').disabled=false;el('submit').disabled=!context}
  });
  load().catch(()=>status('读取失败，请稍后重试。',true));
})();
</script></body></html>
