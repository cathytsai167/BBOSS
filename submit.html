  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')controls()});
  el('submit').addEventListener('click',async()=>{
    if(saving||loading||!context||uncertain||context.m2!==el('m2').value)return;
    if(offline()){status('当前没有网络，填写内容已保留，请联网后再提交。',true);controls();return}
    if(ids.some(id=>el(id).value==='')){status('请填写全部4项数字，实际为0请填0。',true);return}
    const values=Object.fromEntries(ids.map(id=>[id,Number(el(id).value)]));
    if(Object.values(values).some(n=>!Number.isSafeInteger(n)||n<0||n>2147483647)){status('请填写有效的非负整数。',true);return}
    ++sequence;controller?.abort();saving=true;controls();status('正在提交，请勿重复点击…');
    const request=sequence,args={p_m2:context.m2,p_values:values,p_expected_version:context.version,p_allow_decrease:false};
    try{
      let data;
      try{data=await rpc('xuebai_public_submit',args,25000,request)}catch(error){
        if(!error.message.includes('DECREASE_CONFIRM_REQUIRED'))throw error;
        if(!window.confirm('部分数字低于之前记录，确认以本次数值更新？')){status('已取消提交，填写内容已保留。');return}
        data=await rpc('xuebai_public_submit',{...args,p_allow_decrease:true},25000,request);
      }
      if(!valid(data,args.p_m2)){const error=Error('未收到完整的保存确认');error.retryable=true;throw error}
      fill(data);status('提交成功，两个新品的10月最终数均已保存。');
    }catch(error){
      // A lost response may mean the write succeeded. Never automatically replay it.
      unconfirmedWrites.add(args.p_m2);uncertain=true;context=null;failed=true;dirty=true;
      status((error.retryable?'尚未确认是否保存成功，请先重新读取核对，不要重复提交。':'提交未获确认：'+error.message+'。请重新读取核对。')+' 填写内容已保留。',true);
    }finally{saving=false;controls()}
  });
  selectHistory();
})();
</script></body></html>
