</script><script>/* 独立预览：仅本机演示存储，不连接或写入Supabase。 */
const STORAGE='xuebai-monthly-preview-v1';

function cycleStart(now=new Date()){let c=new Date(now.getTime()+8*3600000);const day=(c.getUTCDay()+2)%7;c.setUTCDate(c.getUTCDate()-day);c.setUTCHours(12,0,0,0);if(c.getTime()>now.getTime()+8*3600000)c.setUTCDate(c.getUTCDate()-7);return c.getTime()-8*3600000}
function seed(){return bases.flatMap((b,i)=>{
  if(i===bases.length-1)return []; // 故意保留缺报，检查空值展示。
  const baseline=b.base67+b.dist8Initial+12+i*3;
  const rep=b.rep67Initial+9+i;
  const arr=[{m2:b.name,kind:'baseline',month:'2026-09',as_of:'2026-09-30',distribution:baseline,repurchase:rep,created_at:'2026-10-01T08:00:00Z'}];
  if(i%5!==0)arr.push({m2:b.name,kind:'monthly',month:currentMonth(),as_of:today(),distribution:15+i*2,repurchase:rep+7+i,created_at:new Date().toISOString()});
  return arr;
})}
function readRecords(){if(LIVE)return remoteRecords;try{const x=localStorage.getItem(STORAGE);return x?JSON.parse(x):seed()}catch{return seed()}}
function latest(records,m2,kind,month){return records.filter(r=>r.m2===m2&&r.kind===kind&&r.month===month).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0]||null}
function baselinePrefill(records,m2){
  const confirmed=latest(records,m2,'baseline','2026-09');
  if(confirmed)return {...confirmed,fromLegacy:false};
  const previous=legacyRecords.filter(r=>r.m2===m2).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
  const base=bases.find(b=>b.name===m2);
  if(!previous||!base)return null;
  const n=v=>v==null?null:Number(v);
  const dist8=n(previous.distribution_8),dist9=n(previous.distribution_9);
  const rep68=n(previous.repurchase_68),rep67=n(previous.repurchase_67),rep8=n(previous.repurchase_8);
  return {distribution:dist8!=null&&dist9!=null?Number(base.base67||0)+dist8+dist9:null,
    repurchase:rep68??(rep67!=null&&rep8!=null?rep67+rep8:null),fromLegacy:true};
}
function buildRows(records,month){return bases.map(b=>{
  const baseline=latest(records,b.name,'baseline','2026-09');
  const current=latest(records,b.name,'monthly',month);
  const months=monthList(month);const reports=months.map(m=>latest(records,b.name,'monthly',m));
  const complete=!!baseline&&reports.every(Boolean);
  const total=complete?baseline.distribution+reports.reduce((a,r)=>a+r.distribution,0):null;
  const rep=current?current.repurchase:null;
  return {name:b.name,m3:b.m3,baseline:baseline?.distribution??null,total,rep,new:current?.distribution??null,rate:total&&rep!=null?rep/total:null,as_of:current?.as_of??null,updated:month===currentMonth()&&!!current&&new Date(current.created_at).getTime()>=cycleStart(),complete,baselineRecord:baseline,current};
})}
function totals(rows){const complete=rows.filter(x=>x.complete&&x.rep!=null);return {total:complete.length?complete.reduce((a,x)=>a+x.total,0):null,rep:complete.length?complete.reduce((a,x)=>a+x.rep,0):null,new:rows.some(x=>x.new!=null)?rows.reduce((a,x)=>a+(x.new??0),0):null,n:complete.length}}
function setupSubmit(){
  el('month').value=currentMonth();el('month').max=currentMonth();
  bases.forEach(b=>el('m2').add(new Option(b.name,b.name)));

  const baselineFlag=new URLSearchParams(location.search).get('baseline');

  // 本周专用链接加baseline=1；之后普通链接只呈现两项月内更新。
  function prefill(){el('msg').textContent='';const records=readRecords();const base=latest(records,el('m2').value,'baseline','2026-09');const brought=baselinePrefill(records,el('m2').value);const r=latest(records,el('m2').value,'monthly',el('month').value);
    el('baselineFields').hidden=!(includeBaseline||(el('m2').value&&!base));
    el('baseDist').value=brought?.distribution??'';el('baseRep').value=brought?.repurchase??'';
    el('dist').value=r?.distribution??'';el('rep').value=r?.repurchase??'';
    el('last').textContent=r?'已带入上次填写，请更新。':'';
    if(el('m2').value&&!base&&!includeBaseline)el('last').textContent='请一并补齐9月底最终数。';
    el('basePrefillNote').textContent=brought?(brought.fromLegacy?'已带入上次填写。复购旧口径为6–8月，请核对并补齐9月底最终数。':'已带入上次填写的9月底最终数，请核对。'):'';
  }
  el('m2').addEventListener('change',prefill);el('month').addEventListener('change',()=>{const m=el('month').value;if(!m)return;el('asOf').value=m===currentMonth()?today():new Date(Date.UTC(Number(m.slice(0,4)),Number(m.slice(5,7)),0)).toISOString().slice(0,10);prefill()});
  el('submit').addEventListener('click',async()=>{const month=el('month').value;const as_of=el('asOf').value;const records=readRecords();const m2=el('m2').value;
    const fail=t=>{el('msg').textContent=t;el('msg').className='error'};
    if(!m2)return fail('请选择M2。');if(!month||month<'2026-10'||month>currentMonth())return fail('请选择有效的提报月份。');
    if(!as_of||as_of.slice(0,7)!==month||as_of>today())return fail('截止日期须在提报月份内，且不能晚于今天。');
    if(el('dist').value===''||el('rep').value==='')return fail('两项数字都需要填写，实际为0时请填写0。');
    const distribution=Number(el('dist').value),repurchase=Number(el('rep').value);
    if([distribution,repurchase].some(n=>!Number.isSafeInteger(n)||n<0))return fail('请填写非负整数。');
    const prev=latest(records,m2,'monthly',month);if(prev&&as_of<prev.as_of)return fail('截止日期不能早于本期已保存的截止日期。');
    const existingBase=latest(records,m2,'baseline','2026-09');
    const withBaseline=!el('baselineFields').hidden;
    const baseDist=withBaseline?Number(el('baseDist').value):existingBase?.distribution;
    const baseRep=withBaseline?Number(el('baseRep').value):existingBase?.repurchase;
    if(withBaseline&&(el('baseDist').value===''||el('baseRep').value===''))return fail('请填写9月底最终铺货和复购两项数字。');
    if([baseDist,baseRep].some(n=>!Number.isSafeInteger(n)||n<0))return fail('9月底最终数请填写非负整数。');
    if(baseRep>baseDist)return fail('9月底复购数不能超过9月底铺货数。');
    const earlier=monthList(month).filter(m=>m<month).map(m=>latest(records,m2,'monthly',m));if(earlier.some(r=>!r))return fail('请先补齐此前月份的新增铺货数。');
    const total=baseDist+earlier.reduce((a,r)=>a+r.distribution,0)+distribution;
    if(repurchase>total)return fail('累计复购售点不能超过累计铺货售点。');
    const chronological=records.filter(r=>r.m2===m2&&r.as_of<=as_of).sort((a,b)=>b.as_of.localeCompare(a.as_of)||new Date(b.created_at)-new Date(a.created_at))[0];
    const decreased=(prev&&distribution<prev.distribution)||(chronological&&repurchase<chronological.repurchase)||repurchase<baseRep||(withBaseline&&existingBase&&(baseDist<existingBase.distribution||baseRep<existingBase.repurchase));
    if(decreased&&!window.confirm('填写的售点数低于之前记录，确认以本次数值更新？'))return;
    const timestamp=new Date().toISOString();
    const additions=[];
    if(withBaseline)additions.push({m2,kind:'baseline',month:'2026-09',as_of:'2026-09-30',distribution:baseDist,repurchase:baseRep,note:'',created_at:timestamp});
    additions.push({m2,kind:'monthly',month,as_of,distribution,repurchase,note:'',created_at:timestamp});
    if(withBaseline){const prospective=[...records,...additions];for(const r of prospective.filter(r=>r.m2===m2&&r.kind==='monthly')){const history=monthList(r.month).map(m=>latest(prospective,m2,'monthly',m));if(history.every(Boolean)&&r.repurchase>baseDist+history.reduce((a,x)=>a+x.distribution,0)&&r===latest(prospective,m2,'monthly',r.month))return fail('此基数会导致后续月份复购超过铺货，请先核对后续记录。')}}
    if(LIVE){
      const prior=legacyRecords.filter(r=>r.m2===m2).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
      const base=bases.find(b=>b.name===m2);
      const legacy={repurchase_67:prior?.repurchase_67??base.rep67Initial??0,distribution_8:prior?.distribution_8??base.dist8Initial??0,repurchase_8:prior?.repurchase_8??base.rep8Initial??0,repurchase_68:prior?.repurchase_68??((prior?.repurchase_67??base.rep67Initial??0)+(prior?.repurchase_8??base.rep8Initial??0)),distribution_9:prior?.distribution_9??0};
      el('submit').disabled=true;
      try{
        const {error}=await api.from('xuebai_weekly').insert(additions.map(r=>({...legacy,m2,report_kind:r.kind,report_month:r.month+'-01',report_date:r.as_of,monthly_distribution:r.kind==='monthly'?r.distribution:null,baseline_distribution:r.kind==='baseline'?r.distribution:null,cumulative_repurchase:r.repurchase,report_note:r.note})));
        if(error)throw error;
        await loadRemote();el('msg').textContent='提交成功，已保存本期数据。';el('msg').className='success';
      }catch(error){fail('提交失败：'+error.message)}finally{el('submit').disabled=false}
      return;
    }
    records.push(...additions);
    try{localStorage.setItem(STORAGE,JSON.stringify(records));el('msg').textContent='预览提报已保存，可打开铺货页查看。未提交到线上。';el('msg').className='success'}catch{fail('浏览器不允许本地存储，请换用同一浏览器打开这两页。')}
  });prefill();
}
function setupDashboard(){el('month').value=currentMonth();el('month').max=currentMonth();M3.forEach(m=>{el('filter').add(new Option(m,m));el('m2Filter').add(new Option(m,m))});
  function render(){const month=el('month').value;if(!month||month<'2026-10'||month>currentMonth())return;const records=readRecords();let rows=buildRows(records,month).filter(r=>!el('filter').value||r.m3===el('filter').value);const t=totals(rows),updated=rows.filter(x=>x.current).length;
    el('coverage').textContent=`本月已提报 ${updated}/${rows.length} · 9月底基数已确认 ${rows.filter(r=>r.baseline!=null).length}/${rows.length}`;
    el('total').textContent=fmt(t.total);el('repTotal').textContent=fmt(t.rep);el('rate').textContent=pct(t.rep,t.total);el('newTotal').textContent=fmt(t.new);
    el('totalNote').textContent=`9月底基数 + 各月新增 · 完整数据 ${t.n}/${rows.length} 个M2`;
    el('repNote').textContent=`所选月最新累计值 · 同口径 ${t.n}/${rows.length} 个M2`;
    const dates=rows.map(r=>r.as_of).filter(Boolean).sort();el('newNote').textContent=dates.length?`已报 ${updated}/${rows.length} · 截止日 ${dates[0]}～${dates.at(-1)}`:'待更新';
    el('regions').innerHTML=M3.filter(m=>!el('filter').value||m===el('filter').value).map(m=>{const rs=rows.filter(x=>x.m3===m),s=totals(rs);return `<article class="card region"><h2>${escapeHtml(m)}</h2><p>累计铺货 <strong>${fmt(s.total)}</strong></p><p>累计复购 <b>${fmt(s.rep)}</b></p><p>区域售点复购率 <b>${pct(s.rep,s.total)}</b></p><div class="rate-track"><div class="rate-fill" style="width:${Math.min(100,(s.total?s.rep/s.total:0)*100)}%"></div></div><p>本月新增 <b>${fmt(s.new)}</b></p><small>完整 ${s.n}/${rs.length} · 已提报 ${rs.filter(r=>r.current).length}/${rs.length}</small></article>`}).join('');
    rows=rows.filter(r=>!el('m2Filter').value||r.m3===el('m2Filter').value);
    if(el('sort').value!=='default'){const key=el('sort').value,dir=el('direction').value==='asc'?1:-1;rows.sort((a,b)=>a[key]==null?b[key]==null?0:1:b[key]==null?-1:dir*(a[key]-b[key]))}else rows.sort((a,b)=>M3.indexOf(a.m3)-M3.indexOf(b.m3)||bases.findIndex(x=>x.name===a.name)-bases.findIndex(x=>x.name===b.name));
    el('rows').innerHTML=rows.map(r=>`<tr><td>${escapeHtml(r.m3)} / ${escapeHtml(r.name)}</td><td>${fmt(r.baseline)}</td><td>${fmt(r.new)}</td><td>${fmt(r.total)}</td><td>${fmt(r.rep)}</td><td>${pct(r.rep,r.total)}<div class="rate-track"><div class="rate-fill" style="width:${Math.min(100,(r.rate||0)*100)}%"></div></div></td><td><span class="tag ${r.updated?'ok':''}">${month===currentMonth()?r.updated?'已更新':'待更新':r.current?'已提报':'未提报'}</span></td><td>${r.as_of||'—'}</td></tr>`).join('');
  }['month','filter','m2Filter','sort','direction'].forEach(id=>el(id).addEventListener('change',render));el('refresh').addEventListener('click',async()=>{if(LIVE){try{await loadRemote()}catch(e){el('coverage').textContent='读取失败：'+e.message;return}}render()});window.addEventListener('storage',render);render();
}
async function loadRemote(){
  const all=[];
  for(let start=0;;start+=500){const {data,error}=await api.from('xuebai_weekly').select('*').order('created_at',{ascending:false}).range(start,start+499);if(error)throw error;all.push(...(data||[]));if(!data||data.length<500)break}
  legacyRecords=all;
  remoteRecords=legacyRecords.filter(r=>r.report_kind&&r.report_month).map(r=>({m2:r.m2,kind:r.report_kind,month:r.report_month.slice(0,7),as_of:r.report_date,distribution:r.report_kind==='baseline'?r.baseline_distribution:r.monthly_distribution,repurchase:r.cumulative_repurchase,note:r.report_note,created_at:r.created_at}));
}
async function start(){
  if(!LIVE){if(el('submit'))setupSubmit();else setupDashboard();return}
  document.querySelector('.preview').textContent='月度铺货追踪 · 9月底最终数作为基数，按月份保存周度累计更新。';
  document.querySelector('header a').href+=(document.querySelector('header a').href.includes('?')?'&':'?')+'mode=live';
  api=supabase.createClient(window.XUEBAI_CONFIG.supabaseUrl,window.XUEBAI_CONFIG.supabaseKey);
  if(!el('submit')){
    const {data}=await api.auth.getSession();
    if(!data.session){
      const main=document.querySelector('main');main.hidden=true;
      const gate=document.createElement('section');gate.className='card form';gate.style.margin='10vh auto';gate.innerHTML='<h1>看板登录</h1><p>使用现有看板账号</p><div class="field"><label>邮箱</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div><button id="login">登录查看</button><p id="loginError" class="error"></p>';document.body.appendChild(gate);
      el('login').onclick=async()=>{el('login').disabled=true;const {error}=await api.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('login').disabled=false;if(error){el('loginError').textContent='登录失败：'+error.message;return}gate.remove();main.hidden=false;await initializeLive()};return;
    }
  }
  await initializeLive();
}
async function initializeLive(){try{await loadRemote();if(el('submit'))setupSubmit();else setupDashboard()}catch(e){const notice=document.querySelector('.preview');notice.textContent='读取失败：'+e.message+'。请先执行新版字段SQL，并确认原提报表权限。';notice.classList.add('error');if(el('submit'))el('submit').disabled=true}}
if(typeof document!=='undefined')start();
</script></body></html>
